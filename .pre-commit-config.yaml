default_language_version:
    python: python3.14
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-ast
          - id: check-builtin-literals
          - id: check-case-conflict
          - id: check-executables-have-shebangs
          - id: check-illegal-windows-names
          - id: check-json
          - id: check-merge-conflict
          - id: check-shebang-scripts-are-executable
          - id: check-symlinks
          - id: check-toml
          - id: check-vcs-permalinks
          - id: check-xml
          - id: check-yaml
          - id: debug-statements
          - id: destroyed-symlinks
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: fix-byte-order-marker
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: name-tests-test
            args: [--unittest] # test.*\.py
          - id: pretty-format-json
            args: [--autofix, --indent=4, --no-ensure-ascii, --no-sort-keys]
          - id: requirements-txt-fixer
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.6
      hooks:
          - id: ruff-check
            types_or: [python, pyi, jupyter, pyproject]
            args: [--fix]
          - id: ruff-format
            types_or: [python, pyi, jupyter]

    - repo: local
      hooks:
          - id: prettier
            name: Prettier (locally installed)
            entry: prettier --write --ignore-unknown --end-of-line lf --insert-pragma false --trailing-comma es5 --tab-width 4 --use-tabs false --print-width 80
            language: system
            types_or:
                [
                    javascript,
                    jsx,
                    ts,
                    tsx,
                    css,
                    less,
                    scss,
                    html,
                    json,
                    markdown,
                    yaml,
                ]
            pass_filenames: true
